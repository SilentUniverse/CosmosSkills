name: ci-watch

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fail when the latest ci run on main is red
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PYCODE'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/%s/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=1' % os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(url, headers={
              'Authorization': 'bearer %s' % os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          runs = json.load(urllib.request.urlopen(req))['workflow_runs']
          assert runs, 'no completed ci run on main yet'
          latest = runs[0]
          print('%s %s %s' % (latest['conclusion'], latest['head_sha'][:7], latest['html_url']))
          if latest['conclusion'] != 'success':
              raise SystemExit('latest ci run on main is %s — main is red' % latest['conclusion'])
          PYCODE
