name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      regression: ${{ steps.select.outputs.regression }}
      windows: ${{ steps.select.outputs.windows }}
      ui: ${{ steps.select.outputs.ui }}
      packaging: ${{ steps.select.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - id: select
        env:
          COSMOS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COSMOS_FULL_MATRIX: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python scripts/ci-scope.py --github-output "$GITHUB_OUTPUT"
      - name: Skill catalog validation
        run: python scripts/validate-skills.py

  tests:
    needs: scope
    if: needs.scope.outputs.regression == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Behavior and integration regressions
        run: python workflow/tdd/scripts/test-supervisor.py --cwd . --receipt .scratch/ci/receipts/regression.json --log .scratch/tmp/regression.log --scope full --timeout 600 --measurement-context "${{ runner.os }}-hosted-py39-default-concurrency" -- python scripts/run-tests.py --durations-file .scratch/tmp/test-durations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: |
            .scratch/ci/receipts/regression.json
            .scratch/tmp/test-durations.json
            .scratch/tmp/regression.log
      - name: Shell guardrails corpus (unix profile)
        run: python tooling/shell-guardrails/run_corpus.py tooling/shell-guardrails/scripts/guard-shell.py --platform unix
      # Only this leg forces msys on a Unix host: the other three reach their
      # profile by host detection or by forcing the gate off.
      - name: Shell guardrails corpus (msys profile forced on a Unix host)
        if: runner.os == 'Linux'
        run: python tooling/shell-guardrails/run_corpus.py tooling/shell-guardrails/scripts/guard-shell.py --platform msys

  windows-gate:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: CODEBASE.md regression harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File workflow/test-verify-codebase.ps1
      - name: Shell guardrails corpus (msys profile)
        run: python tooling/shell-guardrails/run_corpus.py tooling/shell-guardrails/scripts/guard-shell.py --platform msys

  ui-checkpoint:
    needs: scope
    if: needs.scope.outputs.ui == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui_fixture/package-lock.json
      - name: Real browser negative control, repair and fixed checkpoint
        run: python scripts/check-ui-fixture.py --setup --output .scratch/tmp/ui-ci

  native-packaging:
    needs: scope
    if: needs.scope.outputs.packaging == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        kind: [pyinstaller-onefile, pyinstaller-onedir, node-sea]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/packaging_fixture/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/packaging_fixture/package-lock.json
      - name: Install the selected packaging tool
        if: matrix.kind != 'node-sea'
        run: python -m pip install -r tests/packaging_fixture/requirements.txt
      - name: Build, verify, export, extract, and run without the source tree
        run: python scripts/check-native-packaging.py --kind ${{ matrix.kind }} --output .scratch/tmp/native-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.kind }}
          path: .scratch/tmp/native-ci/result.json

  required:
    if: always()
    needs: [scope, tests, windows-gate, ui-checkpoint, native-packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve a required gate when optional groups are skipped
        env:
          COSMOS_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['COSMOS_RESULTS'])
          assert results['scope']['result'] == 'success', results
          for group, job in {'regression':'tests', 'windows':'windows-gate', 'ui':'ui-checkpoint', 'packaging':'native-packaging'}.items():
              selected = results['scope']['outputs'][group]
              assert selected in ('true', 'false'), results
              assert results[job]['result'] == 'success' if selected == 'true' else results[job]['result'] in ('success', 'skipped'), results
          PYCODE
