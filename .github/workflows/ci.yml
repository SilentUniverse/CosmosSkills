name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Skill catalog validation (links, frontmatter, resident budget)
        run: python scripts/validate-skills.py
      - name: Shell guardrails corpus (unix profile)
        run: python tooling/shell-guardrails/run_corpus.py tooling/shell-guardrails/scripts/guard-shell.py --platform unix
      # Only this leg forces msys on a Unix host: the other three reach their
      # profile by host detection or by forcing the gate off.
      - name: Shell guardrails corpus (msys profile forced on a Unix host)
        if: runner.os == 'Linux'
        run: python tooling/shell-guardrails/run_corpus.py tooling/shell-guardrails/scripts/guard-shell.py --platform msys

  windows-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: CODEBASE.md regression harness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File workflow/test-verify-codebase.ps1
      - name: Shell guardrails corpus (msys profile)
        run: python tooling/shell-guardrails/run_corpus.py tooling/shell-guardrails/scripts/guard-shell.py --platform msys

  runtime-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: State transactions, ownership, process trees, and native session arguments
        run: python -m unittest discover -s tests -p test_workflow_runtime.py
      - run: python -m unittest discover -s tests -p test_drain_wave.py
      - run: python -m unittest discover -s tests -p test_workflow_state.py
      - run: python -m unittest discover -s tests -p test_handoff_state.py
      - run: python -m unittest discover -s tests -p test_test_supervisor.py
      - run: python -m unittest discover -s tests -p test_preflight_receipt.py
      - run: python -m unittest discover -s tests -p test_overnight.py
