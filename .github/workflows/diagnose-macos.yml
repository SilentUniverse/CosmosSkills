name: diagnose-macos

on: [pull_request]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Environment facts
        run: |
          echo "PATH=$PATH"
          which -a python python3 || true
          python -c "import sys; print('suite python:', sys.executable, sys.version)"
          hostname
          cat /etc/hosts
          scutil --dns | head -30 || true
      - name: Time DNS and HTTPServer construction
        run: |
          python - <<'PY'
          import socket, time

          probes = [
              ("gethostname", lambda: socket.gethostname()),
              ("getfqdn()", lambda: socket.getfqdn()),
              ("getfqdn('127.0.0.1')", lambda: socket.getfqdn('127.0.0.1')),
              ("gethostbyaddr('127.0.0.1')", lambda: socket.gethostbyaddr('127.0.0.1')),
          ]
          for label, probe in probes:
              started = time.perf_counter()
              try:
                  outcome = probe()
              except Exception as exc:
                  outcome = "%s: %s" % (type(exc).__name__, exc)
              print(label, "->", outcome, "in %.3fs" % (time.perf_counter() - started), flush=True)

          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"42")

          started = time.perf_counter()
          server = HTTPServer(("127.0.0.1", 0), Handler)
          print("HTTPServer constructed, port", server.server_port,
                "in %.3fs" % (time.perf_counter() - started), flush=True)
          server.server_close()
          PY
      - name: Reproduce the exact test fixture server
        run: |
          python - <<'PY'
          import subprocess, sys, tempfile, time
          from pathlib import Path

          code = ("from http.server import BaseHTTPRequestHandler, HTTPServer\nclass Handler(BaseHTTPRequestHandler):\n"
                  " def do_GET(self):\n  self.send_response(200); self.end_headers(); self.wfile.write(b'42')\n"
                  "server=HTTPServer(('127.0.0.1',0),Handler)\nprint(server.server_port,flush=True)\nserver.serve_forever()\n")
          with tempfile.TemporaryDirectory(prefix="cosmos managed 空格 ") as temporary:
              root = Path(temporary)
              (root / "server.py").write_text(code, encoding="utf-8")
              started = time.perf_counter()
              with open(root / "application.raw.log", "wb") as sink:
                  process = subprocess.Popen([sys.executable, "-B", str(root / "server.py")],
                                             stdout=sink, stderr=subprocess.STDOUT, cwd=root)
                  log = root / "application.raw.log"
                  deadline = time.monotonic() + 30
                  while time.monotonic() < deadline:
                      if log.read_text().strip():
                          print("port line appeared in %.3fs:" % (time.perf_counter() - started),
                                log.read_text().strip(), flush=True)
                          break
                      time.sleep(0.01)
                  else:
                      print("NO PORT LINE within 30s; poll()=", process.poll(), flush=True)
                  process.kill()
                  process.wait()
          PY
